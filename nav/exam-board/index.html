<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>考试看板</title>
    <link rel="stylesheet" href="styles/exam-board.css">
</head>

<body>
    <div class="board-container">
        <!-- 第一行：当前时间 -->
        <div class="row1">
            <span id="current-time">00:00:00</span>
        </div>

        <!-- 第二行：当前科目 & 结束时间 -->
        <div class="info-grid">
            <div class="left-col">
                <span>当前科目：</span><span id="current-subject">语文</span>
            </div>
            <div class="right-col">
                <span>结束时间：</span><span id="end-time">00:00</span>
            </div>
        </div>

        <!-- 第三行：左侧占位，右侧开始时间 -->
        <div class="info-grid">
            <div class="empty-col"></div>
            <div class="right-col">
                <span>开始时间：</span><span id="start-time">00:00</span>
            </div>
        </div>
    </div>

    <script src="scripts/exam-board.js"></script>
</body>

</html>
